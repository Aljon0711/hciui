<script>
  document.addEventListener('DOMContentLoaded', function () {
    const pages = [
      {
        title: "It's fun to share our toys with friends.",
        body: "When we share, everyone gets a turn to play and feel happy.",
        image: "https://lh3.googleusercontent.com/aida-public/AB6AXuBqtfZC-aPCVVUTMmhaTp2qu73n4N7NBNJIku631Iww5E6gjvOMalTTc03izkhFkFQSWxf0XVqUHk817G9P-iSJaM46VeKDq2YbIWQHFTlj6N-aRwLLt3jSQu5NTieBJ7StGldJmB78GIyWAtE3-fh6SjXc8eENkE1qtNvhBYGDcNw6sRNAawrXanx8VrVt2nrc8cj2-Jazc-gpbHFRXI8_W4x6XWrNtV0SyqX-03esX3sqyBaLm4OrgKtHL3yqUtoNpYZWyxOzIUMZ"
      },
      {
        title: "Sometimes, I am playing by myself.",
        body: "A friend might come over and want to play with me too.",
        image: "https://lh3.googleusercontent.com/aida-public/AB6AXuAIwcoOT-0M5bfulX-dRELmFjiCfaNVbcSEfLZpmnTdoeWqWFZl28fRwASicGzfmXLLUX6lv0TudgBEIvETgA2xBqAr4QiMuSGyZhev2kaweuxv7fltHXi1CqIFQKEyIGoRqftd191ps5lmaNQovRESm5NQh-mMaUPZk6bJsSD7xNcmFgICTwqVgya1Q4L4QmsNQZNbCZGeE26zUTraizSMqQAcxdWnH7tZHo0_LYEvmGicRDHQuwP-mg7f5boUX_od8cH7jqP0Csxu"
      },
      {
        title: "I can share my blocks with my friend.",
        body: "I pick up a block and give it to my friend so we can play together.",
        image: "https://lh3.googleusercontent.com/aida-public/AB6AXuAIwcoOT-0M5bfulX-dRELmFjiCfaNVbcSEfLZpmnTdoeWqWFZl28fRwASicGzfmXLLUX6lv0TudgBEIvETgA2xBqAr4QiMuSGyZhev2kaweuxv7fltHXi1CqIFQKEyIGoRqftd191ps5lmaNQovRESm5NQh-mMaUPZk6bJsSD7xNcmFgICTwqVgya1Q4L4QmsNQZNbCZGeE26zUTraizSMqQAcxdWnH7tZHo0_LYEvmGicRDHQuwP-mg7f5boUX_od8cH7jqP0Csxu"
      },
      {
        title: "We can build a big tower together.",
        body: "Taking turns and sharing makes playing even more fun.",
        image: "https://lh3.googleusercontent.com/aida-public/AB6AXuAGVe3xTjkRyOe-f55JkYmIdCJEmcevQCxMAKkBjmJ5pzz2j2Fb21Lxqdu_ADiGaL4WFPVal31SDCPWeAn7pl6PcYZfkvAaIc7xOabueefbOJ1hi9NisuU3o0u8hvplNQsXnsas_yxM4t8AQighxyeyCwB9gOzSeJTXUIG2mcM-pG6lvHggvOQDxflJjZ7LhliOEAH4ZbbDEjLCQztYVdClSChrpX6JBxWs7VYCEsjQO60Qtm22mHBNLyMzEUMYEr9cFRnBTeh_DIW"
      },
      {
        title: "Sharing makes me and my friend happy!",
        body: "We did it together. Playing with friends is fun!",
        image: "https://lh3.googleusercontent.com/aida-public/AB6AXuAGVe3xTjkRyOe-f55JkYmIdCJEmcevQCxMAKkBjmJ5pzz2j2Fb21Lxqdu_ADiGaL4WFPVal31SDCPWeAn7pl6PcYZfkvAaIc7xOabueefbOJ1hi9NisuU3o0u8hvplNQsXnsas_yxM4t8AQighxyeyCwB9gOzSeJTXUIG2mcM-pG6lvHggvOQDxflJjZ7LhliOEAH4ZbbDEjLCQztYVdClSChrpX6JBxWs7VYCEsjQO60Qtm22mHBNLyMzEUMYEr9cFRnBTeh_DIW"
      }
    ];

    let current = 0;

    const imageEl = document.getElementById('story-image');
    const titleEl = document.getElementById('story-title');
    const bodyEl = document.getElementById('story-body');
    const nextBtn = document.getElementById('next-story');
    const nextLabel = document.getElementById('next-story-label');
    const nextIcon = document.getElementById('next-story-icon');
    const dots = document.querySelectorAll('#story-progress [data-step]');

    function renderPage(index) {
      const page = pages[index];
      if (!page) return;
      imageEl.src = page.image;
      titleEl.textContent = page.title;
      bodyEl.textContent = page.body;

      dots.forEach((dot) => {
        const step = Number(dot.getAttribute('data-step'));
        if (step === index) {
          dot.classList.remove('w-2', 'bg-slate-300', 'dark:bg-slate-600');
          dot.classList.add('w-6', 'bg-primary');
        } else {
          dot.classList.add('w-2');
          dot.classList.remove('w-6', 'bg-primary');
          dot.classList.add('bg-slate-300', 'dark:bg-slate-600');
        }
      });

      if (index === pages.length - 1) {
        nextLabel.textContent = 'Finish Story';
        nextIcon.textContent = 'check_circle';
      } else {
        nextLabel.textContent = 'Next Page';
        nextIcon.textContent = 'arrow_forward';
      }
    }

    nextBtn.addEventListener('click', () => {
      if (current === pages.length - 1) {
        window.location.href = 'home.html';
        return;
      }
      current = Math.min(current + 1, pages.length - 1);
      renderPage(current);
      const container = document.getElementById('story-content');
      if (container) {
        container.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    renderPage(current);
  });
</script>
</body></html>
